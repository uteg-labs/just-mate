# build-match-scorer.yml
# ---
# Build standalone `match_scorer` binaries for macOS, Linux, and Windows.
# Run via GitHub Actions matrix — PyInstaller does not cross-compile, so each
# OS runner builds its own native binary.
#
# Triggers:
#   - workflow_dispatch (manual): pick model + which OSes to build
#   - push tags matching **@* : always build all three (artifacts ship with
#     the release created by release-on-tag.yml)
#
# Artifacts:
#   - match-scorer-{macos,linux,windows}  (tar.gz / zip of dist/match_scorer/)
#
# Required permissions: contents: read (default for actions/checkout).
# No secrets needed.

name: build-match-scorer

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: 'Model to bundle (relative to ml/)'
        required: true
        default: 'checkpoints/model_v0.onnx'
        type: choice
        options:
          - checkpoints/model_v0.onnx
          - checkpoints/model_v3_best.onnx
          - checkpoints/model_v3_abs.onnx
          - checkpoints/model_v3_sym-loss-1.0.onnx
          - checkpoints/model_v3_sym-loss-0.5.onnx
          - checkpoints/model_v3_fix.onnx
          - checkpoints/interest_matcher.onnx
      targets:
        description: 'OS targets (comma list, default = all three)'
        required: false
        default: 'macos,linux,windows'
        type: string
  push:
    tags: [ '**@*' ]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os_id }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os_id: macos
            runner: macos-latest
            archive: tar.gz
            archive_cmd: 'tar -czf match-scorer-macos.tar.gz match_scorer/'
          - os_id: linux
            runner: ubuntu-latest
            archive: tar.gz
            archive_cmd: 'tar -czf match-scorer-linux.tar.gz match_scorer/'
          - os_id: windows
            runner: windows-latest
            archive: zip
            archive_cmd: >-
              powershell -NoProfile -Command
              "Compress-Archive -Path match_scorer -DestinationPath match-scorer-windows.zip -Force"
          - os_id: macos-arm64
            runner: macos-14  # Apple Silicon runner
            archive: tar.gz
            archive_cmd: 'tar -czf match-scorer-macos-arm64.tar.gz match_scorer/'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve model path
        id: model
        shell: bash
        run: |
          # workflow_dispatch input overrides tag-driven default
          if [[ -n "${{ inputs.model_path }}" ]]; then
            echo "path=${{ inputs.model_path }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=checkpoints/model_v0.onnx" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if not in requested targets
        if: ${{ inputs.targets != '' }}
        shell: bash
        run: |
          targets="${{ inputs.targets }}"
          if [[ ",$targets," != *",${{ matrix.os_id }},"* ]]; then
            echo "Skipping ${{ matrix.os_id }} (not in targets: $targets)"
            exit 66
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ml/.venv
          key: uv-${{ runner.os }}-${{ hashFiles('ml/uv.lock', 'ml/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install runtime + build deps
        working-directory: ml
        shell: bash
        run: |
          uv sync --no-group dev
          # pyinstaller is in the dev group — install it explicitly so we don't
          # pull torch/openai into the build env
          uv pip install --python .venv/bin/python 'pyinstaller>=6.10'

      - name: Build binary
        working-directory: ml
        shell: bash
        env:
          MODEL_PATH: ${{ steps.model.outputs.path }}
        run: bash scripts/build_match_scorer.sh

      - name: Package archive
        working-directory: ml/dist
        run: ${{ matrix.archive_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-scorer-${{ matrix.os_id }}
          path: |
            ml/dist/match-scorer-${{ matrix.os_id }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ml/dist/match-scorer-${{ matrix.os_id }}.${{ matrix.archive }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}