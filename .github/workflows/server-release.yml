# builds the server image for every stable server release tag pushed by bump-version,
# pushes it to ghcr and redeploys the dokploy app, which pulls :latest.
# required secrets: DOKPLOY_SERVER_WEBHOOK (the app's deploy webhook url)
name: server-release
run-name: "server — ${{ github.ref_name }}"

on:
  push:
    tags: [ "@justmate/server@*", "!@justmate/server@*-*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/uteg-labs/just-mate-server

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        run: |
          version="${GITHUB_REF_NAME##*@}"
          [ "$GITHUB_REF_TYPE" = tag ] && extra=",$IMAGE:$version"
          echo "tags=$IMAGE:latest,$IMAGE:sha-${GITHUB_SHA::7}$extra" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # an empty body makes dokploy redeploy its configured image (:latest)
      - run: |
          curl -fsS -X POST -H "Content-Type: application/json" -d '{}' "$WEBHOOK"
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_SERVER_WEBHOOK }}
