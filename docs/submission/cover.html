<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JustMate cover</title>
<link rel="stylesheet" href="pack.css">
<style>
  body { width: 1920px; height: 1080px; overflow: hidden; }
  .slide { padding: 120px 140px; }
  .head { display: flex; align-items: center; gap: 28px; }
  .head img:first-child { width: 112px; height: 112px; }
  .head img:last-child { height: 78px; }
  .display { font-size: 150px; margin-top: 64px; }
  .tag { margin-top: 40px; font-size: 46px; line-height: 1.22; letter-spacing: -0.02em; max-width: 780px; }
  .phones { position: absolute; right: 100px; top: 50%; display: flex; gap: 28px; align-items: center; transform: translateY(-50%); }
  .phones .phone:nth-child(1) { transform: rotate(-5deg) translateY(30px); }
  .phones .phone:nth-child(2) { transform: rotate(4deg) translateY(-30px); }
</style>
</head>
<body>
<section class="slide">
  <div class="glow" style="width:1600px;height:1600px;right:-520px;top:-560px"></div>
  <div class="glow mint" style="width:1000px;height:1000px;left:-420px;bottom:-520px"></div>
  <div class="head">
    <img src="../../mobile/assets/brand/just-mate-symbol.svg" alt="">
    <img src="../../mobile/assets/brand/just-mate-wordmark.svg" alt="just-mate">
  </div>
  <div class="display">Meet for real.</div>
  <p class="tag">For anyone lonely in a new city: a plan near you, a person who fits, and someone waiting when you get there.</p>
  <div class="foot"><span>HackYeah 2026 · Sport &amp; Healthcare</span></div>
  <div class="phones">
    <div class="phone" style="width:340px"><img src="screens/plan-bothin.jpg" alt=""></div>
    <div class="phone" style="width:340px"><img src="screens/now-searching.jpg" alt=""></div>
  </div>
</section>
</body>
</html>
