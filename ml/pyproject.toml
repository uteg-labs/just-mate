[project]
name = "just-mate-ml"
version = "0.1.0"
description = "JustMate compatibility scoring service (stretch, see docs/ML-MATCHING.md)"
readme = "README.md"
authors = [
    { name = "justAnArthur", email = "kozubov.arthur@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
