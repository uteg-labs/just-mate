<title>just-mate Motion Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..750&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Review desk: a slim tab rail of pieces, the player as the one big object, the script underneath. Tokens from the just-mate DS. */
  :root {
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --chip: #EDEDEF;
    --fg: #171717;
    --fg2: #6B6B6F;
    --line: rgba(23, 23, 23, 0.08);
    --glow: #FFB23F;
    --on-glow: #1A1205;
    --self: #14B8A6;
    --sans: "Inter", -apple-system, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0A0D; --surface: #16161B; --chip: #202027; --fg: #F5F5F7; --fg2: rgba(235,235,245,0.62);
      --line: rgba(255,255,255,0.08); --glow: #FFB23F; --on-glow: #1A1205; --self: #5EEAD4; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0A0D; --surface: #16161B; --chip: #202027; --fg: #F5F5F7; --fg2: rgba(235,235,245,0.62);
    --line: rgba(255,255,255,0.08); --glow: #FFB23F; --on-glow: #1A1205; --self: #5EEAD4; color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
  .shell { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px; display: grid; gap: 20px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  .brand { font-weight: 750; font-size: 20px; letter-spacing: -0.03em; display: flex; align-items: center; gap: 10px; }
  .brand .muted { color: var(--fg2); font-weight: 500; }
  .dot { width: 14px; height: 14px; border-radius: 99px; background: radial-gradient(circle at 30% 30%, #37C2B3, #FFC56F 70%); }
  .pieces { display: flex; flex-wrap: wrap; gap: 8px; }
  .piece { display: inline-flex; align-items: baseline; gap: 8px; border: 0; border-radius: 999px; padding: 9px 16px; background: var(--chip); color: var(--fg); font: 550 14px/1.2 var(--sans); cursor: pointer; }
  .piece .pd { font: 400 12px var(--mono); color: var(--fg2); font-variant-numeric: tabular-nums; }
  .piece.on { background: var(--fg); color: var(--bg); }
  .piece.on .pd { color: var(--bg); opacity: 0.7; }
  .piece:focus-visible, .row button:focus-visible, .chk input:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .stage { display: grid; gap: 12px; }
  .frame { border-radius: 18px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,0.12); max-width: 100%; }
  .about { margin: 0; color: var(--fg2); max-width: 70ch; text-wrap: balance; }
  .layers { display: flex; flex-wrap: wrap; gap: 16px; border: 0; margin: 0; padding: 0; min-width: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .chk { display: inline-flex; align-items: center; gap: 8px; font: 500 13px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg2); cursor: pointer; }
  .chk input { accent-color: var(--glow); width: 16px; height: 16px; }
  .script h2 { font-size: 13px; font-family: var(--mono); font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg2); margin: 8px 0 10px; }
  .script ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
  .row button { width: 100%; display: grid; grid-template-columns: 64px 96px minmax(0, 1fr); gap: 16px; align-items: baseline; text-align: left; border: 0; background: transparent; color: var(--fg); padding: 12px 16px; font: inherit; cursor: pointer; }
  .row button:hover { background: var(--chip); }
  .row.now button { background: color-mix(in oklab, var(--glow) 18%, var(--surface)); }
  .tc { font: 400 13px var(--mono); color: var(--fg2); font-variant-numeric: tabular-nums; }
  .sid { font: 500 13px var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
  .say { min-width: 0; }
  .note { color: var(--fg2); font-size: 13px; margin: 10px 0 0; }
  @media (max-width: 560px) {
    .row button { grid-template-columns: 56px minmax(0, 1fr); }
    .sid { display: none; }
  }
</style>
<div id="app"></div>

<script src="preview.js"></script>
